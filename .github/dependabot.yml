version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
    ignore:
      # The analyzer's Roslyn floor (RoslynFloorVersion in Directory.Build.props) is a product decision,
      # not routine maintenance: bumping Microsoft.CodeAnalysis.* raises the minimum host compiler able to
      # load the shipped analyzer and breaks it (CS8032) on older SDKs/IDEs. Real enforcement is
      # RoslynFloorTests plus the floor CI job; this only stops Dependabot re-proposing the bump. A single
      # nuget config cannot scope the rule to one project, so these also freeze in the analyzer test project.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
      - dependency-name: "Microsoft.CodeAnalysis.Common"
      # Microsoft.Build.Framework is not a version CHOICE, it is a version MATCH: JustDummies.Cli references
      # it only to compile against, at whatever Microsoft.CodeAnalysis.Workspaces.MSBuild resolves — 5.6.0
      # requires exactly 17.11.48 — and takes it with ExcludeAssets="runtime" so the assembly that actually
      # loads is the SDK's, found by MSBuildLocator. Bumping it alone drags Microsoft.NET.StringTools in as a
      # runtime asset that guard does not cover, and Microsoft.Build.Locator then fails the build outright
      # with MSBL001; measured on pull request #60, red on both OS legs. The number moves only when
      # Workspaces.MSBuild itself asks for another one, and it is re-matched by hand when it does — including
      # the day that makes this pin a downgrade (NU1605) rather than an upgrade.
      - dependency-name: "Microsoft.Build.Framework"
      # The workspace layer follows JustDummies.Cli's target framework, and Roslyn 5.9.0 dropped net8.0:
      # 5.6.0 shipped a lib/net8.0 for each of these, 5.9.0 ships net10.0 and netstandard2.0 — and for
      # Workspaces.MSBuild not even that, net10.0 and net472 alone. JustDummies.Cli is the only project
      # still on net8.0, deliberately, so `dum` installs for a developer on .NET 8 and rolls forward.
      # Restore does NOT report the mismatch: the package stays compatible through its contentFiles/any/any
      # BuildHost payload, so the lib assets resolve to nothing and MSBuildWorkspace simply disappears —
      # three CS0234 in the shell, measured on pull request #82. Ignoring Microsoft.CodeAnalysis.CSharp
      # alone did not hold: CSharp.Workspaces requires it at an exact version, so proposing the workspace
      # layer dragged the ignored package along. These move the day the tool's own runtime floor moves,
      # which is a product decision and not a Dependabot one.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp.Workspaces"
      - dependency-name: "Microsoft.CodeAnalysis.Workspaces.Common"
      - dependency-name: "Microsoft.CodeAnalysis.Workspaces.MSBuild"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    # codeql-action ships init/analyze/upload-sarif as separate actions that MUST run the same version: the
    # analyze step aborts on a database created by a different version ("Loaded a configuration file for
    # version 'X', but running version 'Y'"), so a lone init or analyze bump leaves codeql.yml mismatched and
    # fails the "CodeQL analyze (C#)" job. Group them into one pull request so every step moves in lockstep.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
