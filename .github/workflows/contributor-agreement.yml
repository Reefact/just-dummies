name: Contributor agreement

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

# pull_request_target is intentional here. The workflow never checks out or executes
# pull-request code. Write access is used only to remove the CLA section from direct
# Project Owner PRs.
permissions:
  contents: read
  pull-requests: write

jobs:
  contributor-agreement:
    name: Contributor agreement
    runs-on: ubuntu-latest

    steps:
      - name: Validate contributor agreement
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const ownerLogin = 'reefact';
            const clause = 'I have read the [Contributor Agreement](https://github.com/Reefact/just-dummies/blob/main/CONTRIBUTOR_AGREEMENT.md) and, if I am not the Project Owner (@Reefact), I accept it for this contribution.';
            const startMarker = '<!-- contributor-agreement:start -->';
            const endMarker = '<!-- contributor-agreement:end -->';

            let body = pr.body ?? '';
            const login = pr.user.login.toLowerCase();
            const headRef = pr.head.ref.toLowerCase();
            const isProjectOwner = login === ownerLogin;
            const isClaudeBranch = headRef.startsWith('claude/');
            const isDirectOwnerPr = isProjectOwner && !isClaudeBranch;

            if (isDirectOwnerPr) {
              const start = body.indexOf(startMarker);
              const end = body.indexOf(endMarker);

              if (start >= 0 && end >= start) {
                const before = body.slice(0, start).trimEnd();
                const after = body.slice(end + endMarker.length).trimStart();
                body = after.length > 0 ? `${before}\n\n${after}` : `${before}\n`;

                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  body,
                });

                core.notice('Contributor Agreement section removed from direct Project Owner PR.');
              } else {
                core.info('Direct Project Owner PR: no Contributor Agreement acceptance required.');
              }

              return;
            }

            // Dependabot is not a person and holds nothing to assign: it can make none of the
            // representations the agreement asks for, and there are no economic rights in a version
            // number this repository's own dependency configuration asked for. The gate collects an
            // assignment; naming who it never could bind does not weaken it.
            //
            // Waiving an acknowledgement is the RISKY direction, so it takes the strong proof rather
            // than the convenient one — the same asymmetry `dependabot-automerge.yml` applies when it
            // arms auto-merge. Two things must hold, and someone with push access can claim neither:
            //   - Dependabot OPENED the pull request. `[` and `]` are illegal in GitHub user names,
            //     so `dependabot[bot]` is unregistrable.
            //   - The head is still Dependabot's own GitHub-signed commit. Opening a pull request is
            //     not what puts content in it: anyone with push access can append to a Dependabot
            //     branch, and what they append is a Contribution like any other. Commit author NAMES
            //     are `git config` values and forge freely; GitHub's signature does not, which is why
            //     the signature is the load-bearing half.
            // A `dependabot-autofix` repair keeps Dependabot as the author but drops that signature,
            // so an autofixed pull request asks for the acknowledgement again — which is already what
            // the model says about anything the Project Owner's Claude Code workflow produced.
            // Fail closed: an unreadable head answers "not exempt", which only ever asks for the box.
            if (login === 'dependabot[bot]') {
              let tip = '';

              try {
                const head = await github.rest.repos.getCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: pr.head.sha,
                });

                tip = `${head.data.author?.login ?? ''}|${head.data.commit.verification?.verified === true}`;
              } catch (error) {
                core.info(`Head commit unreadable (${error.message}); the acknowledgement stays required.`);
              }

              if (tip === 'dependabot[bot]|true') {
                core.info('Dependabot pull request at its own signed head: no acknowledgement required.');

                return;
              }

              core.setFailed(
                'Contributor Agreement acknowledgement is required: this Dependabot pull request no longer carries ' +
                "Dependabot's own signed commit at its head, so it carries someone else's contribution. " +
                'Read the agreement and check the corresponding box in the pull request description.'
              );

              return;
            }

            const checkedLines = [
              `* [x] ${clause}`,
              `* [X] ${clause}`,
              `- [x] ${clause}`,
              `- [X] ${clause}`,
            ];

            const lines = body.split(/\r?\n/).map(line => line.trim());
            const isChecked = lines.some(line => checkedLines.includes(line));

            if (!isChecked) {
              const source = isProjectOwner && isClaudeBranch
                ? 'Claude Code PR'
                : `external PR from @${pr.user.login}`;

              core.setFailed(
                `Contributor Agreement acknowledgement is required for this ${source}. ` +
                'Read the agreement and check the corresponding box in the pull request description.'
              );
              return;
            }

            if (isProjectOwner && isClaudeBranch) {
              core.info('Claude Code PR acknowledgement is present.');
            } else {
              core.info(`Contributor Agreement accepted for this contribution by @${pr.user.login}.`);
            }
