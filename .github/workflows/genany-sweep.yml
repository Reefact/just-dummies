name: genany-sweep

# The generative sweep over the scaffolding engine: ~3600 guarded domains produced from a declared axis
# product, each scaffolded, compiled, run past the library's own analyzers and drawn from. It is the
# instrument that FINDS things — the ad-hoc survey of August 2026 produced twenty engine defects where
# mutation testing and the named corpus between them produced none — and until this workflow existed it
# was not in the repository at all: that survey was scratch code, so nothing could replay it, and nobody
# could say whether its findings were closed.
#
# Weekly rather than per pull request, for the reason ADR-0028 gave the generator's mutation leg: the
# cost follows the size of the product and not the size of the diff, so a per-PR run would pay the whole
# bill for a one-line change. What runs on every build instead is the covering slice — about ninety
# shapes touching every axis value at least once — inside the ordinary `JustDummies.GenAny.UnitTests`
# suite. That slice cannot find what the product finds; it exists so the apparatus cannot quietly stop
# working between two Mondays, which is exactly how the other benches in this repository broke.
#
# The suite decides, not this file. `JUSTDUMMIES_SWEEP` is the only thing the job adds: without it the
# full sweep skips and the slice still runs, so `dotnet test JustDummies.sln` stays fast for a developer
# and the generator's mutation leg pays nothing for the sweep existing.
#
# TWO FAILURES, AND THEY ARE NOT THE SAME FAILURE. A finding is the engine's; a sweep bug is ours — a
# generated domain that does not compile on its own. The test reports them apart and in that order,
# because a bench that generated invalid C# cannot be believed about anything else it says. The August
# survey had no such rule and published 208 of its own broken domains as engine defects.

on:
  schedule:
    # Weekly, clear of the other Monday slots this repository already runs (03:47 and 05:47 mutation,
    # 05:23 Scorecard, 06:17 CodeQL, 06:37 the Stryker watch) — see
    # doc/handwritten/for-maintainers/workflows/README.md for the full Monday timetable.
    - cron: '7 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genany-sweep-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  sweep:
    name: Sweep the scaffolding engine
    runs-on: ubuntu-latest
    # Checks the repository out, builds and runs one test project; it calls no API and writes nothing back.
    permissions:
      contents: read
    # Measured at two minutes for the whole product on four cores, plus the build. The cap is many times
    # that so a slower runner is never read as a hang, and far short of the six-hour ceiling GitHub would
    # otherwise apply. It is also room to grow: the cost follows the axis product, which is the thing a
    # future change to `SweepAxes` multiplies.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Run the generative sweep
        env:
          # The switch, and the whole of what this job adds to an ordinary test run.
          JUSTDUMMIES_SWEEP: '1'
        run: >-
          dotnet test JustDummies.GenAny.UnitTests
          -c Release
          --filter FullyQualifiedName~GenerativeSweepTests

      - name: Publish the counts by verdict
        # Counts, never a score — the same refusal the mutation workflow's summary makes, for the same
        # reason (ADR-0093). A run where every shape came back `Unresolved` would score perfectly against
        # any ratio anyone cared to define, and would mean the engine had stopped resolving anything.
        if: always()
        run: |
          set -euo pipefail
          summary="artifacts/sweep/summary.md"
          if [ ! -f "$summary" ]; then
            echo "The sweep produced no summary: it did not get as far as judging a shape." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Generative sweep — shapes by verdict"
            echo
            cat "$summary"
            echo
            echo "\`Held\` drew values its own domain accepts. \`RefusedByDesign\` met a first-class"
            echo "refusal (ADR-0046). \`BlockedForVerification\` and \`Unresolved\` are the two sentinels"
            echo "of §5.5 and §5.6. \`KnownResidue\` is a guard §9 declares the tool does not see."
            echo "\`Finding\` is the engine's problem and \`SweepBug\` is this bench's own."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the sweep's rows
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: genany-sweep-rows
          path: artifacts/sweep/
          # One row per shape is the record a finding is read from; nothing to upload means the run never
          # got as far as producing one.
          if-no-files-found: error
