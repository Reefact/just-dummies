name: sonar

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the analysis only reads the repository. PR decoration is
# delivered by the SonarQube Cloud GitHub App, not by this workflow's token.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  analyze:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-latest
    # Scanner + build + test + coverage is ~3 min; cap a stuck analysis well above that.
    timeout-minutes: 20
    # A run that cannot read SONAR_TOKEN skips the analysis rather than fail on the empty
    # string the secret becomes. Two runs cannot read it:
    #   - a pull request opened from a fork, which never receives this repository's secrets;
    #   - a run triggered by Dependabot, which GitHub treats the same way: it reads the
    #     separate Dependabot secrets store, so `secrets.SONAR_TOKEN` is empty and
    #     `dotnet-sonarscanner begin` fails with "The format of the analysis property
    #     sonar.token= is invalid" — a missing secret reported as a red analysis.
    # Mirroring the token into the Dependabot store is the other way to fix this, and is
    # declined: it would hand the analysis token to the least-trusted runs in this
    # repository to analyse a version bump.
    # Keyed on `github.actor`, not on the pull request's author, because the withheld
    # secret follows whoever TRIGGERED the run — a human pushing to a Dependabot branch
    # gets the secrets back, and that run analyses normally.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history lets Sonar attribute issues via git blame and detect new code.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java
        # The SonarScanner for .NET runs on the JVM; SonarQube Cloud requires Java 17+.
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # The build must sit between `begin` and `end`: the scanner hooks MSBuild to
      # observe the compilation, so it cannot use a pre-built or --no-build output.
      # *.verified.* are Verify snapshot oracles — generated test fixtures, not production source. Excluding them
      # keeps Sonar from analysing the emitted HTML/JS/Markdown as if it were hand-written code (and from counting
      # the near-identical snapshots as duplication).
      # The Benchmarks project is a measurement harness, never shipped and never unit-tested: excluding it from
      # COVERAGE (not from analysis) keeps the new-code coverage gate about the library, while its code still
      # gets the SonarAnalyzer pass.
      #
      # Two shell rules are declined for every *.sh in the repository (policy: ADR-0060 (first-class-errors)). They are ignored HERE,
      # rather than in .editorconfig like the declined Roslyn rules, because they are SonarQube's own analysis
      # rather than compiler diagnostics the scanner republishes — nothing the build does can silence them.
      #   S7682 ("add an explicit return at the end of the function") — every function it flags ends with the
      #     command whose status IS the function's result: a `cat` heredoc, an `awk` invocation, a `printf`, or
      #     in one case an `exit`, after which a return is unreachable. `return 0` would mask those failures and
      #     a bare `return` restates the default, so the rule can only make the scripts worse or longer.
      #   S7679 ("assign this positional parameter to a local variable") — every script here is `#!/bin/sh`, and
      #     `local` is not POSIX. tools/trains.sh already shows the price of obeying without it: the one helper
      #     that needed named parameters carries `_tf_`-prefixed globals instead. Paying that in every two-line
      #     helper, to name a `$1` sitting one line below the function's own name, buys nothing.
      # Coverage exclusions, and why these three and nothing else.
      #
      # A `const` compiles to no IL: the compiler substitutes its value at every use site and emits nothing
      # for the declaration. There is therefore no sequence point, nothing for a coverage run to record, and
      # nothing a test could execute. Sonar counts lines to cover from the syntax tree rather than from the
      # coverage report, so a file of nothing but constants is reported as 0% covered for ever, and no test
      # can move it.
      #
      # Measured on the run that made this necessary: 116 of the 245 new lines to cover sat in these three
      # files, at 0%, which put new_coverage at 52.7% against a threshold of 80 and turned the quality gate
      # red. Overall coverage was 88.5% at the same moment. The gate was measuring an artifact.
      #
      # The three, and the invariant each rests on:
      #   JustDummies.DiagnosticCatalog/**  - the whole project. ADR-0052 records that it declares constants
      #                                       and no executable statement; it is the one project here that
      #                                       cannot even run the analyzers on itself.
      #   DiagnosticIds.cs                  - 28 const string, each delegating to the catalogue.
      #   DiagnosticCategories.cs           - 4 const string, likewise.
      #
      # EXCLUDING IS THE HONEST FIX, and writing tests that touch a constant to raise a number is not: such a
      # test asserts nothing about behaviour and would exist only to move a gauge. What this does risk is the
      # day one of these files gains a method — the exclusion would then hide it. That is why two of the three
      # are named file by file rather than by a pattern, and why the third is a project whose emptiness is a
      # recorded decision rather than a habit.
      - name: Begin analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          dotnet-sonarscanner begin
          /k:"reefact_just-dummies"
          /o:"reefact"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="artifacts/coverage/**/coverage.opencover.xml"
          /d:sonar.exclusions="**/*.verified.*"
          /d:sonar.coverage.exclusions="JustDummies.DiagnosticCatalog/**/*.cs,JustDummies.Analyzers/DiagnosticIds.cs,JustDummies.Analyzers/DiagnosticCategories.cs"
          /d:sonar.issue.ignore.multicriteria="s7682,s7679"
          /d:sonar.issue.ignore.multicriteria.s7682.ruleKey="shelldre:S7682"
          /d:sonar.issue.ignore.multicriteria.s7682.resourceKey="**/*.sh"
          /d:sonar.issue.ignore.multicriteria.s7679.ruleKey="shelldre:S7679"
          /d:sonar.issue.ignore.multicriteria.s7679.resourceKey="**/*.sh"

      - name: Build
        # Disable the CI warning ratchet (Directory.Build.props) for the analysis build only. The scanner
        # needs this compilation to COMPLETE so it can collect the SonarAnalyzer diagnostics and upload them
        # in `end`. The scanner already neutralises TreatWarningsAsErrors, but not MSBuildTreatWarningsAsErrors
        # — which also promotes compiler/analyzer warnings — so a Sonar rule warning would fail this build
        # before results are reported. The ratchet stays enforced by ci.yml (both OS legs), which is the gate;
        # this analysis leg is not.
        run: dotnet build JustDummies.sln -c Release -p:TreatWarningsAsErrors=false -p:MSBuildTreatWarningsAsErrors=false

      - name: Test with coverage
        # Reuse coverage.runsettings so the OpenCover report matches the one the ci workflow produces.
        run: >-
          dotnet test JustDummies.sln -c Release --no-build
          --collect:"XPlat Code Coverage"
          --settings coverage.runsettings
          --results-directory artifacts/coverage
          --logger "console;verbosity=normal"

      - name: End analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
