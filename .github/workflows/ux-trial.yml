name: ux-trial

# The whole developer-UX trial: twenty consumer projects, scaffolded with `any` and tested against the three packages
# packed from this commit. It is a corpus for exploration and a wide regression net, so it runs on demand and once a
# week, and it blocks nothing. The release blocks on the consumer contract only (`tools/ux-trial/run.sh` without
# --all, in release.yml), where a failure means the packages a user receives are broken.
on:
  workflow_dispatch:
  schedule:
    # Mondays, 04:17 UTC: off the hour, and outside the morning peak.
    - cron: '17 4 * * 1'

concurrency:
  group: ux-trial-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  ux-trial:
    name: UX trial (all domains)
    runs-on: ubuntu-latest
    # prepare + twenty domains is ~10 min; cap a hung run rather than the 6-hour default.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Run every domain
        run: tools/ux-trial/run.sh --all
